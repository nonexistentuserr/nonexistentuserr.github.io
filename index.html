<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nonexistentuserr</title>

  <!-- Подключение стильного шрифта -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* 1. Настройки тёплого тёмного фона и всей страницы */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121110; /* Мягкий тёмный тёплый фон */
      color: #E8E3DD; /* Мягкий кремовый цвет текста */
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 2. Верхний блок с вашим текстом */
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 1rem;
      letter-spacing: 3px;
      color: #A39E98; /* Чуть менее яркий текст для девиза */
      text-transform: uppercase;
    }

    /* 3. Карточка с формой обратной связи */
    .contact-card {
      background: #1C1A18; /* Тёплый подтон карточки */
      border: 1px solid rgba(232, 227, 221, 0.12);
      border-radius: 16px;
      padding: 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .contact-card h2 {
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #A39E98;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      background: #121110;
      border: 1px solid rgba(232, 227, 221, 0.15);
      border-radius: 8px;
      color: #E8E3DD;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #E8E3DD;
    }

    /* Кнопка отправки */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #E8E3DD;
      color: #121110;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.88;
    }

    /* Нижняя плашка */
    .footer-tag {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #A39E98;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Ваша главная надпись -->
  <div class="hero">
    <h1>LAUNCHING<br>SOON</h1>
    <p>SIC ITUR AD ASTRA</p>
  </div>

  <!-- Карточка анкеты/формы -->
  <div class="contact-card">
    <h2>GET IN TOUCH</h2>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="form-group">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" placeholder="Введите имя" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" rows="3" placeholder="Ваше сообщение..."></textarea>
      </div>

      <button type="submit" class="submit-btn">ОТПРАВИТЬ</button>
    </form>
  </div>

  <!-- Подпись с никнеймом -->
  <div class="footer-tag">
    nonexistentuserr
  </div>

</body>
</html>
